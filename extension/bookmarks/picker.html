<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recent Markdown</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./picker.css" />
  </head>
  <body>
    <main class="picker">
      <header>
        <div class="title-row">
          <img src="../icons/icon-32.png" width="30" height="30" alt="" />
          <div>
            <h1>Recent Markdown</h1>
            <p id="scope">Searching bookmarked folders…</p>
          </div>
          <button id="manage" class="quiet" type="button">Manage folders</button>
        </div>
        <label class="search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20 20-4.2-4.2m1.7-5.05a6.75 6.75 0 1 1-13.5 0 6.75 6.75 0 0 1 13.5 0Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="filter" type="search" placeholder="Filter files, folders, or commits" autocomplete="off" aria-label="Filter recent Markdown" />
          <kbd>Esc</kbd>
        </label>
      </header>

      <section id="loading" class="message-state">
        <span class="spinner" aria-hidden="true"></span>
        <strong>Looking for recent files</strong>
        <span>Checking commit history across your bookmarked folders…</span>
      </section>

      <section id="empty" class="message-state" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.75A1.75 1.75 0 0 1 8.75 3h6.5A1.75 1.75 0 0 1 17 4.75v16l-5-3.15L7 20.75z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <strong id="empty-title">No recent Markdown found</strong>
        <span id="empty-copy">Try a longer search window or add another folder.</span>
        <button id="empty-manage" class="secondary" type="button">Manage bookmarks</button>
      </section>

      <section id="results" class="results" role="listbox" aria-label="Recent Markdown files" hidden></section>

      <footer>
        <span id="result-count"></span>
        <span class="keyboard-help"><kbd>↑</kbd><kbd>↓</kbd> navigate <kbd>Enter</kbd> present</span>
      </footer>
      <details id="warnings" hidden>
        <summary>Some folders could not be fully searched</summary>
        <ul id="warning-list"></ul>
      </details>
    </main>

    <template id="result-template">
      <button class="result-row" type="button" role="option" aria-selected="false">
        <span class="document-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4v13H7zM14 3.5v4h4M9.5 12h6m-6 3h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg></span>
        <span class="result-copy">
          <span class="result-title"></span>
          <span class="result-location"></span>
          <span class="result-message"></span>
        </span>
        <span class="result-meta">
          <time></time>
          <span class="result-status"></span>
        </span>
        <svg class="enter-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7v5a3 3 0 0 1-3 3H6m4-4-4 4 4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </template>
    <script type="module" src="./picker.js"></script>
  </body>
</html>
