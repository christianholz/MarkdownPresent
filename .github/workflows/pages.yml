name: Build and deploy MarkdownPresent

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mdpresent-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - name: Determine release and preview versions
        id: versions
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$(git -C source describe --tags --abbrev=0 --match 'v*')"
            release_version="${release_tag#v}"
            total_commit_count="$(git -C source rev-list --count HEAD)"
            echo "preview_label=${release_version}-dev.${total_commit_count}" >> "$GITHUB_OUTPUT"
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Check out latest release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: release
          ref: ${{ steps.versions.outputs.release_tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            release/pnpm-lock.yaml
            source/pnpm-lock.yaml

      - name: Install release dependencies
        working-directory: release
        run: pnpm install --frozen-lockfile

      - name: Test release
        working-directory: release
        run: pnpm test

      - name: Build release site
        working-directory: release
        env:
          MDPRESENT_DISPLAY_VERSION: ${{ steps.versions.outputs.release_tag }}
        run: pnpm build:site

      - name: Assemble release site
        run: |
          mkdir -p pages-dist
          cp -R release/dist/. pages-dist/

      - name: Replicate release as tag preview
        if: github.ref_type == 'tag'
        run: |
          mkdir -p pages-dist/preview
          cp -R release/dist/. pages-dist/preview/

      - name: Install preview dependencies
        if: github.ref_type != 'tag'
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Test preview
        if: github.ref_type != 'tag'
        working-directory: source
        run: pnpm test

      - name: Build preview site
        if: github.ref_type != 'tag'
        working-directory: source
        env:
          MDPRESENT_DISPLAY_VERSION: ${{ steps.versions.outputs.preview_label }}
          MDPRESENT_EXTENSION_URL: ./mdpresent-chrome-extension.zip
          MDPRESENT_EXTENSION_LABEL: Install dev extension
        run: pnpm build:site

      - name: Add preview site
        if: github.ref_type != 'tag'
        run: |
          mkdir -p pages-dist/preview
          cp -R source/dist/. pages-dist/preview/

      - name: Build preview extension
        if: github.ref_type != 'tag'
        working-directory: source
        run: pnpm build:extension

      - name: Package preview extension
        if: github.ref_type != 'tag'
        run: |
          cd source/dist/extension
          zip -qr ../../../pages-dist/preview/mdpresent-chrome-extension.zip .

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
